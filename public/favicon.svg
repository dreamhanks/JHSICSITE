<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Homille">
  <!-- Homille house mark. The three paths are the same geometry as
       LogoMark in src/components/art/Icons.tsx, authored in a 24x24
       space and placed here at scale(.8333) inside a 32x32 tile, so
       the house fills 20 of 32 units - the same optical ratio the
       header mark has (20px glyph in a 36px tile).

       Stroke is 2.4 in the 24-space rather than the header's 1.8:
       after scaling that renders as 2 units of 32, which survives
       being drawn at 16x16 in a browser tab. Thinner strokes break
       up at that size. Geometry is untouched. -->
  <rect width="32" height="32" rx="7" fill="#7a5c2e"/>
  <g transform="translate(6 6) scale(.8333)"
     fill="none" stroke="#fff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5 12 3l9 7.5"/>
    <path d="M5.5 9.5V21h13V9.5"/>
    <path d="M12 21v-6"/>
  </g>
</svg>
